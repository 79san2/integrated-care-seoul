name: Monthly provider evidence audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
permissions:
  contents: write
concurrency:
  group: provider-evidence-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check official evidence and missing values
        run: python scripts/audit_providers.py
      - name: Publish audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly provider evidence audit"
            git push
          fi
