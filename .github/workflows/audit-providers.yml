name: Monthly provider evidence audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_providers.py'
      - 'scripts/update_provider_data.py'
      - 'scripts/notify_provider_changes.py'
      - '.github/workflows/audit-providers.yml'
  schedule:
    - cron: '0 0 1 * *'
permissions:
  contents: write
concurrency:
  group: provider-evidence-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 firebase-admin
      - name: Check official evidence and missing values
        run: python scripts/audit_providers.py
      - name: Apply verified institution contact updates and review figures
        run: python scripts/update_provider_data.py
      - name: Notify smartphone about changed official sources
        continue-on-error: true
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python scripts/notify_provider_changes.py
      - name: Publish audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-report.json auto-update-report.json data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly provider evidence audit"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo 'Audit report saved successfully.'
                exit 0
              fi
              echo "Concurrent update detected; retry $attempt/5"
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo 'Failed to publish after five attempts.'
            exit 1
          fi
