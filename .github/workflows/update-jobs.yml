name: Update recruitment notices

on:
  push:
    paths:
      - 'sources.json'
      - 'scripts/update_jobs.py'
      - '.github/workflows/update-jobs.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect institution and specialist recruitment boards
        run: python scripts/update_jobs.py
      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No recruitment data changes."
          else
            git commit -m "Update official institution recruitment notices"
            git push
          fi
