name: Update recruitment notices
on:
  push:
    paths:
      - 'sources.json'
      - 'scripts/update_jobs.py'
      - 'scripts/send_push.py'
      - '.github/workflows/update-jobs.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"
permissions:
  contents: write
jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Save previous job data
        run: cp jobs.json /tmp/jobs-before.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 firebase-admin
      - name: Collect institution and specialist recruitment boards
        run: python scripts/update_jobs.py
      - name: Send push notification to the registered smartphone
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_DEVICE_TOKEN: ${{ secrets.FCM_DEVICE_TOKEN }}
        run: python scripts/send_push.py
      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No recruitment data changes."
          else
            git commit -m "Update official institution recruitment notices"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish updated jobs after 3 attempts."
                exit 1
              fi
              sleep 3
            done
          fi
